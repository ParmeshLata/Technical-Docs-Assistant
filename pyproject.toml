[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-docs-assistant"
version = "0.1.0"
description = "A corrective LangGraph RAG workflow served through FastAPI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langgraph>=1,<2",
  "chromadb>=1,<2",
  "openai>=1.60,<3",
  "pydantic-settings>=2,<3",
  "python-multipart>=0.0.18,<1",
  "beautifulsoup4>=4.12,<5",
  "httpx[socks]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data/corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
